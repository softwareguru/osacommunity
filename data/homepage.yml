participate_cards:
    - title: Attend a meetup
      text: "A few times a year we gather in person — SF, NYC, Chicago, Brussels — for short technical talks and open discussion. Online sessions in between."
      link: See the schedule
      url: "#events"

    - title: Speak or propose a session
      text: "Practitioner talks only: what you built, what broke, what you'd do differently. First-time speakers welcome."
      link: Submit a topic
      url: https://osacon.io/get-involved

    - title: Join the Slack
      text: "Ask questions, share benchmarks, and get unstuck with maintainers and engineers in your part of the stack."
      link: Open the Slack invite
      url: https://go.osacom.io/slack

    - title: Subscribe to the newsletter
      text: "One monthly email: upcoming events, new recordings, and community project notes. No vendor pitches."
      link: Subscribe for updates
      url: "#subscribe-to-newsletter"

    - title: Partner with the community
      text: "Host a meetup, contribute venue or infrastructure, or support OSA Con. Project-neutral by design."
      link: Talk to the organizers
      url: "/contact"

    - title: Explore OSA Con
      text: "The annual gathering: Nov 2, 2026, San Francisco + online, free. Plus five years of session recordings."
      link: Explore OSA Con 2026
      url: "https://osacon.io"

