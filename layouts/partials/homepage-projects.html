{{ $data := index .Site.Data }}
<section class="projects-section text-center">
  <p class="mt">Today’s analytic systems have been shaped by open source projects such as: </p>
  <div class="swiper mySwiper">
    <div class="swiper-wrapper featured-projects">
    {{ range $data.homepage.projects }}
      <div class="swiper-slide project-logo"><img src="{{.image}}" alt="{{.name}}"></div>
    {{ end }}
    </div>
  </div>
</section >
<script>
var swiper = new Swiper(".mySwiper", {
  spaceBetween: 0,
  slidesPerView: 'auto',
  speed: 6000,
  centeredSlides: true,
  autoplay: {
    delay: 0,
    disableOnInteraction: false,
    waitforTransition: false,
  },
  loop: true,
});
</script>
